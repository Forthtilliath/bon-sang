name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Non bloquant : `maplibre-gl` <= 6.4.0 a une faille XSS critique dont le seul
      # correctif (6.9.0) est une refonte ESM/WebGL2. Le code n'appelle jamais
      # `setHTML`/`setText` (bulles construites via `setDOMContent`), donc non
      # exploitable ici. Migration maplibre 6 suivie à part.
      - run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://example.com' }}

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://example.com' }}
      - run: nohup npm run start > /tmp/next-start.log 2>&1 &
      - run: npx wait-on http://localhost:3000
      # Informatif pour l'instant : les temps de chargement varient trop sur les
      # runners GitHub partagés pour bloquer la CI dessus. À rendre bloquant une
      # fois une base de référence stable établie (cf. AMELIORATIONS.md).
      - uses: treosh/lighthouse-ci-action@v12
        continue-on-error: true
        with:
          urls: |
            http://localhost:3000/
            http://localhost:3000/eligibilite
            http://localhost:3000/collectes
          budgetPath: ./lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true
