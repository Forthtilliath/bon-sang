version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    # Montées testées et bloquées car elles cassent le site ou l'outillage (retestées
    # le 2026-09-26). À lever quand l'écosystème suit :
    # - eslint 10 : `eslint-plugin-jsx-a11y` et `eslint-plugin-react` ne l'acceptent
    #   pas encore en peer → `npm ci` échoue (ERESOLVE).
    # - typescript ≥ 6.1 (dont la 7, réécriture native) : hors de la plage supportée
    #   par `typescript-eslint` (`<6.1.0`).
    # - @types/node majeure : doit suivre la version de Node du projet (`.nvmrc` = 24).
    ignore:
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        versions: [">= 6.1.0"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    # Une seule PR mensuelle pour toutes les actions plutôt qu'une par action.
    groups:
      github-actions:
        patterns: ["*"]
