version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Majeures bloquées, à lever quand l'écosystème suit :
    # - eslint 10 : `eslint-plugin-jsx-a11y` ne l'accepte pas encore en peer (ERESOLVE).
    # - maplibre-gl 6 : casse l'affichage des tuiles vectorielles CARTO.
    ignore:
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: maplibre-gl
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
